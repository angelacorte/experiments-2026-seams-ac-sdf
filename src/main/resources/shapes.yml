# The shapes the scenarios batch over, by name: see it.unibo.collektive.entrypoint.ShapeKind for the parameters
# of each kind (angles in degrees). Every shape contains the origin of its frame, which each scenario moves where the
# shape belongs. The exports record only the name: to change a shape, prefer adding an entry over editing one.
star: { kind: star, radius: 30, points: 5 }
star8: { kind: star, radius: 30, points: 8, spikiness: 4 }
hexagon: { kind: hexagon, radius: 30 }
pentagon: { kind: polygon, radius: 30, sides: 5, rotation: 90 }
square: { kind: square, side: 50 }
triangle: { kind: triangle, halfBase: 30, height: 52 }
ring: { kind: ring, radius: 25, halfWidth: 6 }
crescent: { kind: crescent, radius: 30, offset: 20 }
horseshoe: { kind: horseshoe, radius: 20, aperture: 45, armLength: 15, thickness: 6 }
circular_sector: { kind: circular_sector, radius: 35, halfAperture: 60 }
cut_disk: { kind: cut_disk, radius: 30, cutHeight: -10 }
vesica: { kind: vesica, radius: 35, offset: 20 }
rounded_x: { kind: rounded_x, width: 45, armHalfWidth: 6 }
stairs: { kind: stairs, stepWidth: 15, stepHeight: 12, steps: 4 }
question_mark: { kind: question_mark, radius: 20, thickness: 4 }
spiral: { kind: spiral, spacing: 12, turns: 3, thickness: 4 }
fibonacci_spiral: { kind: fibonacci_spiral, scale: 2.5, quarterTurns: 7, thickness: 4 }
letter_h: { kind: text, text: H, height: 36, thickness: 4 }
letters_hi: { kind: text, text: HI, height: 36, thickness: 4 }
