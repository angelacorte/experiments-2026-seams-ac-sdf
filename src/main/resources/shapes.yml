# The shapes the scenarios batch over, by name. Each entry has the `type` of an SDF (e.g., Star, from
# it.unibo.collektive.sdf.shape, .primitive or .text) and the parameters of its constructor, by name:
# positions as [x, y], angles in radians, optional parameters may be left out.
# The positions are where the shape lies with global positions (repulsionOnly, nodes deployed in [0, 100]^2).
# The other scenarios move the center of the shape (its `center`, `origin` or `start`, or the centroid of its
# vertices) on the leader (relativeToLeader) or on the anchors' centroid (rangeOnly).
# The exports record only the name: to change a shape, prefer adding an entry over editing one.
star: { type: Star, center: [50, 50], radius: 50, pointCount: 5 }
star8: { type: Star, center: [50, 50], radius: 30, pointCount: 8, spikiness: 4 }
hexagon: { type: Hexagon, center: [50, 50], radius: 30 }
pentagon: { type: RegularPolygon, center: [50, 50], radius: 30, sides: 5, rotation: 1.5707963 } # A vertex upwards
square: { type: Square, center: [50, 50], side: 50 }
triangle: { type: Triangle, a: [20, 32.667], b: [80, 32.667], c: [50, 84.667] } # Centroid on [50, 50]
ring: { type: Ring, center: [50, 50], radius: 25, thickness: 6 }
crescent: { type: Crescent, center: [50, 50], radius: 30, offset: 20 }
horseshoe: { type: Horseshoe, center: [50, 50], radius: 20, aperture: 0.7853982, armLength: 15, thickness: 6 }
circular_sector: { type: CircularSector, center: [50, 32.5], radius: 35, halfAperture: 1.0471976 } # Tip below
cut_disk: { type: CutDisk, center: [50, 50], radius: 30, cutHeight: -10 }
vesica: { type: Vesica, center: [50, 50], radius: 35, offset: 20 }
rounded_x: { type: RoundedX, center: [50, 50], width: 45, radius: 6 }
stairs: { type: Stairs, origin: [20, 26], stepWidth: 15, stepHeight: 12, steps: 4 } # Bottom-left corner
question_mark: { type: QuestionMark, center: [50, 70], radius: 20, thickness: 4 } # Center of the arc
spiral: { type: Spiral, center: [50, 50], spacing: 12, turns: 3, thickness: 4 }
fibonacci_spiral: { type: FibonacciSpiral, center: [50, 50], scale: 2.5, quarterTurns: 7, thickness: 4 }
letter_h: { type: TextBlock, text: H, start: [41, 32], glyphHeight: 36, thickness: 4 } # Bottom-left of the H
letters_hi: { type: TextBlock, text: HI, start: [41, 32], glyphHeight: 36, thickness: 4 }
