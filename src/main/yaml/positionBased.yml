incarnation: collektive

variables:
  filename: &filename { formula: "'positionBased'" } # Root of the exported file names, shared by all the exporters
  dataPath: &dataPath { formula: "'data/' + filename" } # Where the metrics are exported
  positionsPath: &positionsPath { formula: "'data/positions/' + filename" } # Where the node positions are exported (for the plots)
  maxSpacing: &maxSpacing { formula: 0.8 * communicationRange } # Largest spacing: below the range, so that no neighbor is pushed out of it
  cellReach: &cellReach { formula: 0.5 * communicationRange } # Reach of a Voronoi cell (Lloyd): half the range, so that the neighbors that shape it are in range
  nodes: &nodes 100
  communicationRange: &communicationRange # Shared by the network model and the formation
    formula: 30
  maxSeed: &maxSeed
    type: SystemEnvVariable
    parameters: [ "MAX_SEED", 5 ] # default 5 if not specified
  seed: &seed
    min: 0
    max: *maxSeed
    step: 1
    default: 42
  shape: &shape # Same list in every scenario: names from src/main/resources/shapes.yml
    type: ArbitraryVariable
    parameters: [ star, [ star, hexagon, ring, crescent, horseshoe ] ]

seeds:
  scenario: *seed
  simulation: *seed

network-model:
  type: AdaptiveRange
  parameters: [*maxSpacing, 5, *communicationRange, 12, 6]

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.entrypoint.PositionBasedKt.positionBasedEntrypoint]
      - type: SpeedToTarget
        parameters: [ ]

deployments:
  - type: Rectangle
    parameters: [*nodes, 0, 0, 100, 100]
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.ShapeProperty
        parameters: [ *shape ]
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
      - type: it.unibo.collektive.coverage.LatticeParameters
        parameters:
          # SoftDisk (linear in the overlap, zero beyond the spacing), InverseSquare (never zero), Spring (pull and push, zero beyond 1.5 spacings) or Lloyd (Voronoi centroid)
          # repulsion: { type: SoftDisk, parameters: { stiffness: 0.2 } } # Push per unit of overlap
          # repulsion: { type: InverseSquare, parameters: { coefficient: 0.03 } } # Push at the spacing, per unit of it
          # repulsion: { type: Spring, parameters: { stiffness: 0.2, attraction: 0.5 } } # Pull or push per unit of distance from the spacing; pull as a fraction of the push (below 1, or a crowd never spreads)
          repulsion: { type: Lloyd, parameters: { gain: 0.5, reach: *cellReach } } # Towards the centroid of the Voronoi cell within reach (half the range), clipped to the shape: ignores the spacing (Rprop step below damps its oscillations)
          maxSpeed: 1.0
          # Adaptive (driven by the pressure of the ring), Neighborhood (of all the neighbors within 1.5 spacings) or Fixed
          spacing:
            type: Adaptive
            parameters:
              initial: 2.0
              rate: 0.05 # Fraction of the pressure error recovered at each round
              pressureMargin: 0.5 # Target pressure, as a fraction of the ring radius
              max: *maxSpacing
          # spacing: { type: Fixed, parameters: { spacing: 4.0 } } # ~sqrt(area / devices / 0.866) fills the shape
          step: { type: StepRule, parameters: { decrease: 0.5, increase: 1.2, minGain: 0.05 } } # Gain factor on an overshoot (the control reverses), while the control keeps its direction, and the smallest gain
          # step: { type: StepRule, parameters: { decrease: 1.0, increase: 1.0, minGain: 1.0 } } # Fixed step, for Lloyd

export:
  - type: CSVExporter
    parameters: { fileNameRoot: *filename, interval: 10.0, exportPath: *dataPath }
    data:
      - time
      # How evenly the devices cover the shape (see FormationMetrics). Global positions: the shape lies where shapes.yml puts it
      - type: it.unibo.alchemist.boundary.extractors.FormationMetrics
        parameters: [ global ]
      - type: CoverageMetrics
        parameters: [ global ]
  - type: it.unibo.alchemist.boundary.exporters.DevicePositionsExporter
    parameters: { fileNameRoot: *filename, interval: 2.0, exportPath: *positionsPath, placement: global }
    data:
      - time

terminate:
  - type: AfterTime
    parameters: [ 1000.0 ]