incarnation: collektive

variables:
  filename: &filename { formula: "'dynamicPositionBased'" } # Root of the exported file names, shared by all the exporters
  dataPath: &dataPath { formula: "'data/' + filename" } # Where the metrics are exported
  positionsPath: &positionsPath { formula: "'data/positions/' + filename" } # Where the node positions are exported (for the plots)
  cellReach: &cellReach { formula: 0.5 * communicationRange } # Reach of a Voronoi cell (Lloyd): half the range, so that the neighbors that shape it are in range
  spawnRangeFraction: &spawnRangeFraction 0.8 # Fraction of the communication range within which nodes spawn
  spawnTime: &spawnTime 600
  spawnCount: &spawnCount 400
  killTime: &killTime 1200
  survivors: &survivors 50
  nodes: &nodes 100
  communicationRange: &communicationRange
    formula: 30
  shape: &shape # Same list in every scenario: names from src/main/resources/shapes.yml
    type: ArbitraryVariable
    parameters: [ star, [ star, hexagon, ring, crescent, circle ] ]
  maxSeed: &maxSeed
    type: SystemEnvVariable
    parameters: [ "MAX_SEED", 5 ] # default 5 if not specified
  seed: &seed
    min: 0
    max: *maxSeed
    step: 1
    default: 42
  start: &start # Where the nodes start: left = entirely to the left of the shape (none inside), centered = square of side 100 around its center (the classic [0, 100]^2)
    type: ArbitraryVariable
    parameters: [ left, [ left, centered ] ]

seeds:
  scenario: *seed
  simulation: *seed

network-model:
  type: AdaptiveRange
  parameters: [*communicationRange, 5, 100, 12, 6]

environment:
  type: Continuous2DEnvironment
  global-programs:
    # At spawnTime, spawnCount new nodes appear at random within spawnRangeFraction * communicationRange
    # of the nodes already present, so that each one has at least a neighbor
    # (SpawnRandomNodes with [ time, count, x, y, width, height ] spawns in a fixed rectangle instead)
    - type: SpawnNearNodes
      parameters: [ *spawnTime, *spawnCount, *communicationRange, *spawnRangeFraction ]
    - type: KillRandomNodes # At killTime, random nodes are removed until only survivors are left
      parameters: [ *killTime, *survivors ]

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.entrypoint.PositionBasedKt.positionBasedEntrypoint]
      - type: SpeedToTarget
        parameters: [ ]

deployments:
  - type: ShapeStart # Where the nodes start (see ShapeStart): [ count, shape, start, width of the left strip, side of the centered square, gap ]
    parameters: [*nodes, *shape, *start, 50, 100, 10]
    nodes: 2.0 # retention time
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.ShapeProperty
        parameters: [ *shape ]
      - type: it.unibo.collektive.coverage.LatticeParameters
        parameters:
          repulsion: { type: Lloyd, parameters: { gain: 0.5, reach: *cellReach } } # Towards the centroid of the Voronoi cell within reach (half the range), clipped to the shape: wants the fixed step below
          maxSpeed: 1.0
          step: { type: StepRule, parameters: { decrease: 0.5, increase: 1.2, minGain: 0.05 } } # Gain factor on an overshoot (the control reverses), while the control keeps its direction, and the smallest gain
          # step: { type: StepRule, parameters: { decrease: 1.0, increase: 1.0, minGain: 1.0 } } # Fixed step, for Lloyd

export:
  - type: CSVExporter
    parameters: { fileNameRoot: *filename, interval: 10.0, exportPath: *dataPath }
    data:
      - time
      - type: FormationMetrics
        parameters: [ global ]
      - type: CoverageMetrics
        parameters: [ global ]
  # The position of every device, with the SDF there and the leader/anchors, for the snapshots and the GIFs
  # (python): in data/positions/dynamicPositionBased, with the same file names as the metrics
  - type: it.unibo.alchemist.boundary.exporters.DevicePositionsExporter
    parameters: { fileNameRoot: *filename, interval: 2.0, exportPath: *positionsPath, placement: global }
    data:
      - time

terminate: # Three equal spans: before the spawn, between the spawn and the kill, after the kill
  - type: AfterTime
    parameters: [ 1800.0 ]
