incarnation: collektive

_communication-range: &communicationRange 20 # Shared by the network model and the formation

network-model:
  type: ConnectWithinDistance
  parameters: [*communicationRange]

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [it.unibo.collektive.entrypoint.RangeOnlyKt.rangeOnlyEntrypoint]
      - type: SpeedToTarget
        parameters: [ ]

seeds:
  simulation: 10

deployments:
  - type: Rectangle
    parameters: [100, 0, 0, 100, 100]
    contents:
      # Anchors
      - { molecule: leaderElectionBound, concentration: 200 } # Hops within which anchor 1 is elected
      - { molecule: minAnchorsHeight, concentration: 10.0 } # Min distance of anchor 3 from the line of anchors 1-2
      # Shape
      - { molecule: starRadius, concentration: 45.0 }
      - { molecule: starPoints, concentration: 5 }
      - { molecule: starSpikiness, concentration: 2.5 }
      # Lattice (as in repulsionOnly.yml; push per neighbor rescaled to the larger spacing)
      - { molecule: ringSize, concentration: 6 } # Nearest neighbors forming the first ring (6 in a hexagonal lattice)
      - { molecule: outsideRepulsionGain, concentration: 0.1 } # Repulsion scale outside the shape
      - { molecule: sdfGradientStep, concentration: 0.001 } # Step of the finite differences on the SDF
      - { molecule: maxSpeed, concentration: 1.0 }
      # Repulsion: softDisk (linear in the overlap, zero beyond the spacing) or inverseSquare (never zero)
      - { molecule: repulsion, concentration: softDisk }
      - { molecule: softDiskStiffness, concentration: 0.05 } # softDisk: push per unit of overlap
      - { molecule: inverseSquareCoefficient, concentration: 0.007 } # inverseSquare: push at the spacing, per unit of it
      # Spacing: adaptive (driven by the pressure) or fixed
      - { molecule: spacing, concentration: adaptive }
      - { molecule: fixedSpacing, concentration: 16.0 } # fixed: ~sqrt(area / devices / 0.866) fills the shape
      - { molecule: initialSpacing, concentration: 2.0 } # adaptive, and the rest of this group
      - { molecule: spacingRate, concentration: 0.05 } # Fraction of the pressure error recovered at each round
      - { molecule: pressureMargin, concentration: 0.5 } # Target pressure, as a fraction of the ring radius
      - { molecule: communicationRange, concentration: *communicationRange }
      - { molecule: maxSpacingFraction, concentration: 0.8 } # Largest spacing, as a fraction of the communication range
      # Step size
      - { molecule: stepDecrease, concentration: 0.5 } # Gain factor when the control reverses (an overshoot)
      - { molecule: stepIncrease, concentration: 1.2 } # Gain factor while the control keeps its direction
      - { molecule: minStepGain, concentration: 0.05 }
      # Steering without bearing (frame alignment from the own commands)
      - { molecule: forgettingFactor, concentration: 0.95 } # Past evidence kept at each round
      - { molecule: maxDisplacement, concentration: 5.0 } # Estimate changes above this are frame jumps
      - { molecule: minMotionEnergy, concentration: 5.0 } # Motion needed before steering
      - { molecule: minConfidence, concentration: 0.1 } # Direction spread needed before steering
      - { molecule: explorationNoise, concentration: 0.1 } # Random motion kept while steering
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.BodyFrameProperty
