incarnation: collektive

variables:
  spreadMode: &spreadMode
    type: ArbitraryVariable
    parameters: [FIXED, [FIXED, EDGE, SPRING]]

network-model:
  type: ConnectWithinDistance
  parameters: [18]

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [it.unibo.collektive.entrypoint.RelativeToLeaderKt.relativeToLeaderEntrypoint]
      - type: SpeedToTarget
        parameters: [ ]

deployments:
  - type: Rectangle
    parameters: [300, 0, 0, 100, 100]
    contents:
      - molecule: spreadMode
        concentration: *spreadMode
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.RelativePositionSensorProperty
