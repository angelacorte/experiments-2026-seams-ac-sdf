incarnation: collektive

variables:
  maxSeed: &maxSeed
    type: SystemEnvVariable
    parameters: [ "MAX_SEED", 5 ] # default 5 if not specified
  seed: &seed
    min: 0
    max: *maxSeed
    step: 1
    default: 42
  nodes: &nodes
    type: ArbitraryVariable
    parameters: [ 100, [ 50, 100, 200, 300 ] ]
  communicationRange: &communicationRange # Shared by the network model and the formation
    type: ArbitraryVariable
    parameters: [ 20, [ 10, 20, 30 ] ]
  maxSpacing: &maxSpacing { formula: 0.8 * communicationRange } # Largest spacing: below the range, so that no neighbor is pushed out of it
  cellReach: &cellReach { formula: 0.5 * communicationRange } # Reach of a Voronoi cell (Lloyd): half the range, so that the neighbors that shape it are in range
  shape: &shape # Same list in every scenario: names from src/main/resources/shapes.yml
    type: ArbitraryVariable
    parameters: [ star, [ star, hexagon, ring, crescent, horseshoe ] ]
  spreadMode: &spreadMode
    type: ArbitraryVariable
    parameters: [FIXED, [FIXED, EDGE, SPRING]]

network-model:
  type: ConnectWithinDistance
  parameters: [*communicationRange]

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.entrypoint.DisplacementBasedKt.displacementBasedEntrypoint ]
      - type: SpeedToTarget
        parameters: [ ]

deployments:
  - type: Rectangle
    parameters: [*nodes, 0, 0, 100, 100]
    contents:
      - molecule: spreadMode
        concentration: *spreadMode
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.ShapeProperty
        parameters: [ *shape ]
      - type: it.unibo.collektive.alchemist.device.sensors.impl.RelativePositionSensorProperty
      # The lattice, as in repulsionOnly.yml (push per neighbor rescaled to the larger spacing)
      - type: it.unibo.collektive.formation.LatticeParameters
        parameters:
          repulsion: { type: Lloyd, parameters: { gain: 1.0, reach: *cellReach } } # Towards the centroid of the Voronoi cell within reach (half the range), clipped to the shape: ignores the spacing, and wants the fixed step below
          maxSpeed: 1.0
          # Adaptive (driven by the pressure of the ring), Neighborhood (of all the neighbors within 1.5 spacings) or Fixed
          spacing:
            type: Adaptive
            parameters:
              initial: 2.0
              rate: 0.05 # Fraction of the pressure error recovered at each round
              pressureMargin: 0.5 # Target pressure, as a fraction of the ring radius
              max: *maxSpacing
          # spacing: { type: Fixed, parameters: { spacing: 4.0 } } # ~sqrt(area / devices / 0.866) fills the shape
          # step: { type: StepRule, parameters: { decrease: 0.5, increase: 1.2, minGain: 0.05 } } # Gain factor on an overshoot (the control reverses), while the control keeps its direction, and the smallest gain
          step: { type: StepRule, parameters: { decrease: 1.0, increase: 1.0, minGain: 1.0 } } # Fixed step, for Lloyd

export:
  - type: CSVExporter
    parameters: { fileNameRoot: "displacementBased", interval: 10.0, exportPath: "data/displacementBased" }
    data:
      - time
      # How evenly the devices cover the shape (see FormationMetrics). The shape is centered on the leader, with the axes of the environment
      - type: it.unibo.alchemist.boundary.extractors.FormationMetrics
        parameters: [ leader ]
