# Common configuration of the simulation services: one image (docker/sim/Dockerfile), the Gradle task changes.
x-simulation: &base-simulation-image
  depends_on:
    prepare:
      condition: service_completed_successfully
  image: angelacortecchia/${PROJECT_NAME:-experiments-2026-seams-ac-sdf}-sim:${VERSION:-latest}
  build:
    context: .
    dockerfile: ./docker/sim/Dockerfile
  volumes:
    - ./data:/experiment/data

services:
  prepare:
    image: alpine:3.24.2
    volumes:
      - .:/experiment:rw
    entrypoint: /bin/sh -c
    command:
      - |
        mkdir -p /experiment/data
        chmod 777 /experiment/data
        mkdir -p /experiment/charts
        chmod 777 /experiment/charts

  dynamicPopulationPositionBased:
    <<: *base-simulation-image
    environment:
      - MAX_SEED=50
      - GRADLE_TASK=runDynamicPopulationPositionBasedBatch

  dynamicPopulationDisplacementBased:
    <<: *base-simulation-image
    environment:
      - MAX_SEED=50
      - GRADLE_TASK=runDynamicPopulationDisplacementBasedBatch

  dynamicPopulationDistanceBased:
    <<: *base-simulation-image
    environment:
      - MAX_SEED=50
      - GRADLE_TASK=runDynamicPopulationDistanceBasedBatch

  charts:
    depends_on:
      prepare:
        condition: service_completed_successfully
      dynamicPopulationDisplacementBased:
        condition: service_completed_successfully
      dynamicPopulationDistanceBased:
        condition: service_completed_successfully
      dynamicPopulationPositionBased:
        condition: service_completed_successfully
    image: angelacortecchia/${PROJECT_NAME:-experiments-2026-seams-ac-sdf}-charts:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/charts/Dockerfile
    volumes:
      - ./data:/experiment/data
      - ./charts:/experiment/charts

  finish:
    depends_on:
      charts:
        condition: service_completed_successfully
    image: alpine:3.24.2
    volumes:
      - .:/experiment:rw
    entrypoint: /bin/sh -c
    command:
      - |
        find /experiment/data -type d -exec chmod 777 {} \;
        find /experiment/charts -type d -exec chmod 777 {} \;
        find /experiment/data -type f -exec chmod 666 {} \;
        find /experiment/charts -type f -exec chmod 666 {} \;
